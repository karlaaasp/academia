<main>
    <section class="conteudo">
        <h1>Fale com a gente</h1>
        <p>Peça sua aula experimental ou tire dúvidas.</p>

        <form action="#" method="get">
            <div class="campo">
                <label for="nome">Seu nome</label>
                <input type="text" id="nome" name="nome" required>
            </div>

            <div class="campo">
                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" name="telefone" placeholder="(21) 90000-0000">
            </div>

            <div class="campo">
                <label for="interesse">Quero</label>
                <select id="interesse" name="interesse">
                    <option value="experimental">Agendar uma aula experimental</option>
                    <option value="planos">Saber mais sobre os planos</option>
                    <option value="duvida">Tirar uma dúvida</option>
                </select>
            </div>

            <div class="campo">
                <label for="mensagem">Mensagem</label>
                <textarea id="mensagem" name="mensagem" rows="4"></textarea>
            </div>

            <button type="submit" class="botao">Enviar</button>
        </form>
    </section>
</main>
